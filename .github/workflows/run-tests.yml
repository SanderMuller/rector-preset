name: run-tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP floor is 8.4: Pest 5 and PHPUnit 13 require it.
          # prefer-lowest resolves rector/rector to 2.8.0, the floor of ~2.8.0.
          - { php: '8.4', stability: prefer-lowest }
          - { php: '8.4', stability: prefer-stable }
          - { php: '8.5', stability: prefer-lowest }
          - { php: '8.5', stability: prefer-stable }

    name: P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci

  # The presets reference rector-laravel, the Pest Rector packages, hihaho/rector-rules and
  # laravel-fluent-validation-rector only behind class_exists() checks. This job removes them all
  # and runs the suite again, including the boot tests, to prove those checks.
  without-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: P8.4 - without extensions

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Remove the extensions
        run: |
          composer remove --dev --no-update driftingly/rector-laravel mrpunyapal/rector-pest pestphp/pest-plugin-rector hihaho/rector-rules sandermuller/laravel-fluent-validation-rector
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci --exclude-group=extensions
